# Local backing services for development: `pnpm infra:up`
name: seshakart-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seshakart
      POSTGRES_PASSWORD: seshakart
      POSTGRES_DB: seshakart
    # Also creates seshakart_test and seshakart_shadow (tests and drift check).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seshakart']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata:
