# Local backing services for development: `pnpm infra:up`
name: seshakart-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seshakart
      POSTGRES_PASSWORD: seshakart
      POSTGRES_DB: seshakart
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seshakart']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata:
