# SeShaKart edge proxy (inside the private network, behind Cloudflare/CDN + TLS).
#
#   /api/*  → API   (direct: real client IP for rate limits, one hop fewer)
#   /*      → Web   (Next.js)
#
# This server OVERWRITES X-Forwarded-For with the single resolved client IP, so the
# API runs with TRUST_PROXY_HOPS=1. Trusting CF-Connecting-IP is only safe when the
# origin firewall accepts traffic from Cloudflare's IP ranges alone (see DEPLOYMENT.md).

upstream seshakart_api { server api:4000; keepalive 32; }
upstream seshakart_web { server web:3000; keepalive 32; }

# Cloudflare sends the visitor IP in CF-Connecting-IP; fall back to the TCP peer.
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_name www.seshakart.com seshakart.com;

  # Canonical host (TLS terminates at the CDN/load balancer in front of this server).
  if ($host = seshakart.com) { return 301 https://www.seshakart.com$request_uri; }

  client_max_body_size 12m;         # product image uploads (validated again by the API)
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Real-IP $client_ip;
  # Overwrite (never append) with the client IP resolved above, so a client cannot
  # spoof its address by sending its own X-Forwarded-For header.
  proxy_set_header X-Forwarded-For $client_ip;

  location /api/ {
    proxy_pass http://seshakart_api;
    proxy_read_timeout 30s;
  }

  location /_next/static/ {
    proxy_pass http://seshakart_web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://seshakart_web;
  }
}
